name: Jiggler
options:
  bundleIdPrefix: com.toby
  deploymentTarget:
    macOS: "13.0"

targets:
  Jiggler:
    type: application
    platform: macOS
    sources:
      - path: Sources/Jiggler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toby.Jiggler
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: Sources/Jiggler/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Sources/Jiggler/Jiggler.entitlements
      properties:
        com.apple.security.app-sandbox: false
